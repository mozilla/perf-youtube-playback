---
on:
  push:
    branches:
      - raptor-2020
jobs:
  deploy-stage:
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
         credentials_json: ${{ secrets.GCP_SA_KEY_STAGE }}

      - name: set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download media files
        uses: engineerd/configurator@v0.010
        with:
          url: ${{ secrets.YTTEST_MEDIA_URL }}
      - name: Deploy raptor-2020 and media files to bucket.
        run: |
          sh ./bin/gcs-deploy.sh ${{ secrets.YTTEST_BUCKET_STAGE }}
  deploy-prod:
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Set up Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
         credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy raptor-2020 website assets bucket.
        run: |
          sh ./bin/gcs-deploy.sh ${{ secrets.YTTEST_BUCKET_PROD }}
      - name: Deploy media to bucket
        run: |
          sh ./bin/media-deploy.sh
        env:
          YTTEST_BUCKET: ${{ secrets.YTTEST_BUCKET }}